[package]
name = "zent75-rs"
version = "0.0.0"
edition = "2021"
description = "Firmware for the HOVEY WORKS ZENT75-HE (HPM5361, RISC-V)"
license = "MIT OR Apache-2.0"
publish = false

# A `no_std` + `no_main` image has no test harness: keep `cargo clippy --all-targets` and
# `cargo test` from trying to build one.
[[bin]]
name = "zent75-rs"
path = "src/main.rs"
test = false
bench = false

[features]
default = ["profiler"]
# Statistical CPU profiler (src/debug/prof.rs, tools/profile.py): GPTMR0 and 8 KB of AHB SRAM,
# idle until a capture is started.
profiler = []
# Log every key object on each HID change (src/debug/mod.rs). Costs scan time: debugging only.
key-log = []

[dependencies]
# HPMicro's embedded-Rust HAL; the MCU is an HPM5361 (docs/hardware.md). Upstream rev 620f58d
# plus the fixes listed in ../hpm-hal/PATCHES.md.
hpm-hal = { path = "../hpm-hal", default-features = false, features = [
    "rt",
    "embassy",
    "time",
    "hpm5361",
    "usb-pin-reuse-hpm5300",
] }

riscv = { version = "0.15.0", features = ["critical-section-single-hart"] }
andes-riscv = "0.1.1"

# Pin the startup/runtime crate. hpm-hal only asks for `^0.3.0`, so the resolver
# otherwise picks 0.3.5, which bumped to `riscv 0.16` and enables
# `critical-section-single-hart` on it — while hpm-hal keeps enabling it on
# `riscv 0.15`. Two riscv majors each exporting the critical-section impl =
# "symbol `_critical_section_1_0_acquire` multiply defined" at link time.
# 0.3.1 is the newest hpm-riscv-rt still on `riscv 0.15`, so everything unifies
# onto a single critical-section implementation.
hpm-riscv-rt = "=0.3.1"

embedded-hal = "1.0.0"

embassy-time = { version = "0.5.0", features = ["tick-hz-1_000_000"] }
embassy-executor = { version = "0.9.1", features = [
    "nightly",
    "arch-riscv32",
    "executor-thread",
] }
embassy-sync = "0.7.2"
embassy-usb = { version = "0.5", default-features = false, features = ["max-handler-count-8", "max-interface-count-8"] }
static_cell = "2"
critical-section = "1"

# Hardware-independent keyboard logic (no `std` feature on the board).
zent-core = { path = "../core" }

[profile.release]
# Symbols are not flashed to the microcontroller, so there is no reason to strip
# them; keeping them helps post-mortem disassembly of our own builds.
strip = false
lto = true
opt-level = "z" # optimize for size
debug = 2
# Panic locations (`file!()`) and debug info as `<crate>-<version>/src/…` instead of absolute
# paths: saves DLM, makes the image independent of where the repo and ~/.cargo live, and
# keeps the builder's home directory out of it.
trim-paths = "object"

# The 8 kHz scan path (engine + key pipeline + lighting bookkeeping) runs in zent-core: size
# optimisation made it ~2x slower than the 125 µs scan budget allows.
[profile.release.package.zent-core]
opt-level = 3
