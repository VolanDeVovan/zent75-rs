[build]
target = "riscv32imafc-unknown-none-elf"

[target.riscv32imafc-unknown-none-elf]
# Only used by `cargo run` with a JTAG probe (needs the case open). Normal flashing is
# UF2: ./package-uf2.sh then tools/flash_uf2.py — see docs/boot-recovery.md.
runner = [
    "probe-rs",
    "run",
    "--chip",
    "HPM5361",
    "--protocol",
    "jtag",
]

rustflags = [
    # Target features: default for imafc is "+m,+a,+c,+f"; add the Zb* bit-manip
    # extensions the HPM5300 core implements (matches the hpm-hal example).
    "-C",
    "target-feature=+zba,+zbb,+zbc,+zbs",
    # Linker scripts:
    "-C",
    "link-arg=-Tmemory.x",     # our memory map (app at 0x80040000)
    "-C",
    "link-arg=-Tdevice.x",     # __INTERRUPTS, peripheral interrupt names (hpm-metapac)
    "-C",
    # Our own copy of hpm-riscv-rt's hpm-link.x: TinyUF2 boot signature at 0x80040000, entry at
    # +4, and all code/rodata in ILM/DLM so NOR writes never race XIP fetches (see the file).
    "link-arg=-Tzent-link.x",
    "-C",
    "link-arg=-nmagic",
]

[unstable]
build-std = ["core"]
